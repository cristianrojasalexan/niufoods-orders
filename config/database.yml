# Connection settings default to the PostgreSQL service in docker-compose.yml.
# Override them with the DB_* variables (see .env.example) or with DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: niufoods_orders_development

test:
  <<: *default
  database: niufoods_orders_test

production:
  <<: *default
  database: niufoods_orders_production
  url: <%= ENV["DATABASE_URL"] %>
